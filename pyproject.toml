[project]
name = "scandy"
version = "0.1.0"
description = "Receipt scanner using Apple Vision OCR and a local extraction model"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "flask-cors>=6.0.2",
    # Downloads the extraction model's GGUF on first scan.
    "huggingface-hub>=0.34.0",
    "pillow>=12.2.0",
    # Apple's Vision framework does the text recognition. macOS-only, and the
    # only platform the 'vision' backend runs on — Docker and Linux use Ollama.
    "pyobjc-framework-Quartz>=12.0; sys_platform == 'darwin'",
    "pyobjc-framework-Vision>=12.0; sys_platform == 'darwin'",
    "waitress>=3.0.2",
    "werkzeug>=3.1.8",
]

[dependency-groups]
# Only needed to re-run backend/bench/compare_pipelines.py, which compares this
# pipeline against the MLX-VLM one it replaced. Not imported by the app.
bench = [
    "mlx-vlm>=0.6.15",
    "psutil>=7.0.0",
    "rapidocr-onnxruntime>=1.4.4",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
]

[tool.pyright]
extraPaths = ["backend"]
